name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-flight run when the same branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # Pinned to current majors (verified against the CI-green sibling repos):
      # checkout v7, setup-python v7.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

      # The attack gate is the guardrail, and it protects the BENCHMARK rather
      # than a product: it exits 1 when the corpus has stopped being able to
      # tell defense configurations apart, or when every defense suddenly looks
      # effective. A coverage matrix degrades silently, so a payload edit that
      # silently makes the suite unable to rank anything cannot merge.
      - name: Attack gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m bench.attacks.gate

      # The demo is the offline path through the whole matrix: if it breaks,
      # the build breaks. The suite also compares its output with the offline
      # capture in SAMPLE_RUN.md (tests/test_demo.py), line for line.
      - name: Demo (offline mock)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_demo.py

      # The figures in README.md and SAMPLE_RUN.md: the real-model ones derived
      # from the published rows under results/ and the re-score files beside
      # them, the offline ones from a fresh run of the mock matrix.
      - name: README and SAMPLE_RUN figures match the rows and the mock
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/check_readme_numbers.py
